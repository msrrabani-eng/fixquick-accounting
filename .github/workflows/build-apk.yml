name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04 # fixed image, so the build tools do not change under us
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unit tests (accounting engine)
        run: node tests/core.test.js

      - name: Install Capacitor (exact versions from package-lock.json)
        run: |
          # with the lock file every build uses exactly the same versions; the first build creates it (saved to the repo below)
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm ls --depth=0 || true

      - name: Create Android project
        run: npx cap add android

      - name: Permissions (camera for QR scanning, fingerprint, saving backups to Documents)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          f = 'android/app/src/main/AndroidManifest.xml'
          s = open(f).read()
          add = ''
          for line in ['<uses-permission android:name="android.permission.CAMERA" />',
                       '<uses-feature android:name="android.hardware.camera" android:required="false" />',
                       '<uses-permission android:name="android.permission.USE_BIOMETRIC" />',
                       '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />',
                       '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />']:
              if line.split('"')[1] not in s: add += '    ' + line + '\n'
          i = s.index('<application'); s = s[:i] + add + '    ' + s[i:].lstrip() if add else s
          # Android 10: let the «ذخیره» button write into Documents/FixQuick
          if 'requestLegacyExternalStorage' not in s: s = s.replace('<application', '<application android:requestLegacyExternalStorage="true"', 1)
          open(f, 'w').write(s)
          PY
          grep -n "uses-" $M

      - name: Icons and splash
        run: |
          pip install --quiet pillow
          python3 tools/android_assets.py android/app/src/main/res

      - name: Version number
        run: |
          V=$(grep -oP "APP_VER = '\K[^']+" www/diag.js); echo "APP_VER=$V" >> $GITHUB_ENV
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Sync web files
        run: npx cap sync android

      - name: Use the fixed signing key (so updates install over the old version)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore
          python3 - <<'PY'
          import re, os
          f = 'android/app/build.gradle'
          g = open(f).read()
          ks = os.path.abspath('android-signing/debug.keystore')
          block = ('    signingConfigs {\n        fixq {\n            storeFile file("' + ks + '")\n'
                   '            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n')
          g, n1 = re.subn(r'^android \{\n', lambda m: m.group(0) + block, g, count=1, flags=re.M)
          g, n2 = re.subn(r'^(\s*)buildTypes \{\n', lambda m: m.group(0) + m.group(1) + '    debug {\n' + m.group(1) + '        signingConfig signingConfigs.fixq\n' + m.group(1) + '    }\n', g, count=1, flags=re.M)
          assert n1 == 1 and n2 == 1, (n1, n2)
          open(f, 'w').write(g)
          PY
          grep -n -A6 "signingConfigs" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FixQuick-Accounting.apk

      - name: Check the APK is signed with the fixed key
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $AS verify --print-certs FixQuick-Accounting.apk | tee certs.txt
          grep -qi "dd67504f0c9fc6bcb4e1427050a62f0fa0ab3698edf228d6a7b6dd141f85139c" certs.txt || { echo "WRONG SIGNING KEY"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: FixQuick-Accounting-APK
          path: FixQuick-Accounting.apk

      - name: Keep the exact versions for every later build
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json && git commit -m "Lock dependency versions (package-lock.json) from build ${{ github.run_number }}"
            git pull --rebase origin main && git push origin HEAD:main || echo "could not save package-lock.json this time; the next build will try again"
          else echo "package-lock.json unchanged"; fi

      - name: Publish this version (kept for good) and update "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}; V=$APP_VER
          cp FixQuick-Accounting.apk "FixQuick-Accounting-$V-build$N.apk"
          # one release per build, never deleted: every old APK stays downloadable (with the full source of that version)
          gh release create "v$V-build$N" "FixQuick-Accounting-$V-build$N.apk" --target "$GITHUB_SHA" --latest=false \
            --title "Fix Quick Accounting $V (build $N)" --notes "APK version $V, build $N, from commit ${GITHUB_SHA::7}."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FixQuick-Accounting.apk --target "$GITHUB_SHA" --latest \
            --title "Fix Quick Accounting $V (build $N)" --notes "Newest APK: version $V, build $N, commit ${GITHUB_SHA::7}. Every earlier version is in its own release."
